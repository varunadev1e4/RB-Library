<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2C1810" />
  <title>Offline — Community Library</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #FDFAF5;
      color: #2C1810;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-family: Georgia, serif; font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    p  { color: #8B5E3C; font-size: 0.95rem; line-height: 1.6; max-width: 280px; margin: 0 auto; }
    .btn {
      display: inline-block;
      margin-top: 2rem;
      background: #2C1810;
      color: #FDFAF5;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="icon">📚</div>
  <h1>You're Offline</h1>
  <p>No internet connection right now. Previously viewed books and events may still be available.</p>
  <button class="btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
